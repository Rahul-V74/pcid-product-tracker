services:
  - type: web
    name: pcid-product-tracker
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pcid-product-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '[]'

databases:
  - name: pcid-product-tracker-db
    plan: free
    region: singapore
    databaseName: pcid_tracker
    user: pcid_tracker
