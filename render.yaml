services:
  - type: web
    name: pcid-product-tracker
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    envVars:
      # DATABASE_URL is NOT managed here. The database is an external Aiven
      # Postgres instance (free tier, permanent, no 30-day expiry unlike
      # Render's own free Postgres) - its connection string is set manually
      # as a secret env var on the Render service dashboard/API, not synced
      # from this blueprint. Do not add a Render-managed `databases:` block
      # here, or a blueprint sync could overwrite DATABASE_URL and point the
      # app at a different, empty database.
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '[]'
